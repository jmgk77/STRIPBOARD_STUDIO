<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stripboard Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <strong class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="10" fill="#0f5132"/>
        <g stroke="#c48a3e" stroke-width="5" stroke-linecap="round">
          <line x1="9" y1="15" x2="55" y2="15"/>
          <line x1="9" y1="32" x2="55" y2="32"/>
          <line x1="9" y1="49" x2="55" y2="49"/>
        </g>
        <g fill="#101010">
          <circle cx="18" cy="15" r="3"/><circle cx="32" cy="15" r="3"/><circle cx="46" cy="15" r="3"/>
          <circle cx="18" cy="32" r="3"/><circle cx="32" cy="32" r="3"/><circle cx="46" cy="32" r="3"/>
          <circle cx="18" cy="49" r="3"/><circle cx="32" cy="49" r="3"/><circle cx="46" cy="49" r="3"/>
        </g>
      </svg>
      Stripboard Studio
    </strong>
    <button id="new">New</button>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <button id="saveAs">Save As</button>
    <span id="saveState" class="savestate" title="whether the board has unsaved changes"></span>
    <span class="sep"></span>
    <label>Cols <input id="cols" type="number" min="4" max="100" value="55"></label>
    <label>Rows <input id="rows" type="number" min="4" max="60" value="24"></label>
    <span class="sep"></span>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <span class="sep"></span>
    <button id="connect" class="toggle" title="connect two pins (C)">Connect</button>
    <button id="addCut" class="toggle" title="cut a strip (X)">Cut</button>
    <button id="addJumper" class="toggle" title="draw a jumper (J)">Jumper</button>
    <button id="addMount" class="toggle" title="place a mounting hole (M)">Mount</button>
    <span class="sep"></span>
    <details class="menu" id="viewMenu">
      <summary>View</summary>
      <div class="menu-items">
        <label class="check"><input type="checkbox" id="lc-parts" checked> parts</label>
        <label class="check"><input type="checkbox" id="lc-wires" checked> wires</label>
        <label class="check"><input type="checkbox" id="lc-cuts" checked> cuts</label>
        <label class="check"><input type="checkbox" id="lc-copper" checked> copper</label>
        <label class="check"><input type="checkbox" id="lc-nets" checked> nets</label>
        <label class="check"><input type="checkbox" id="lc-grid" checked> grid 5x5</label>
        <div class="menusep"></div>
        <label class="check"><input type="checkbox" id="copper"> copper side (mirrored)</label>
        <label class="check"><input type="checkbox" id="names" checked> pin names</label>
        <label class="check"><input type="checkbox" id="connections"> connections (always)</label>
        <label class="check"><input type="checkbox" id="mountzones" checked> mountable zones (safe to drill)</label>
        <label class="check"><input type="checkbox" id="diagonals"> diagonal jumpers (routing)</label>
        <label class="check"><input type="checkbox" id="schematic"> schematic view</label>
      </div>
    </details>
    <details class="menu" id="exportMenu">
      <summary>Export</summary>
      <div class="menu-items">
        <button id="print">Print / PDF (1:1)</button>
        <button id="netlist">Netlist…</button>
        <button id="ascii">Text (ASCII)…</button>
      </div>
    </details>
    <span id="status" class="status"></span>
  </header>
  <main>
    <aside id="palette">
      <h3>Parts</h3>
      <button id="newPart" class="wide">+ New pin bar</button>
      <input id="partSearch" type="search" placeholder="search parts…" autocomplete="off">
      <div id="palette-list" class="list"></div>
    </aside>
    <div id="center">
      <div class="vtabbar">
        <button class="vtab active" data-vtab="edit">Edit</button>
        <button class="vtab" data-vtab="solve">Solve</button>
        <button class="vtab" data-vtab="easy">Easy</button>
        <button class="vtab" data-vtab="optimize">Balanced</button>
        <button class="vtab" data-vtab="compact">Compact</button>
        <button class="vtab" data-vtab="trim">Trim</button>
        <span class="grow"></span>
        <button id="sizeSearch" title="search board sizes (Pareto trade-offs)">Size…</button>
        <span id="tabNote" class="muted"></span>
        <button id="useThis" class="primary" style="display:none">Use this</button>
      </div>
      <div id="canvasWrap">
        <div id="readonlyBar" class="readonlybar" style="display:none">
          Read-only result — editing is disabled. Click <b>Use this</b> (top right) to copy it to the Edit board.
        </div>
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="zoomCtl">
          <span id="zoomPct">100%</span>
          <button id="zoomOut" title="zoom out (−)">−</button>
          <button id="zoomFit" title="fit to window (0)">⤢</button>
          <button id="zoomIn" title="zoom in (+)">+</button>
        </div>
      </div>
    </div>
    <aside id="panel">
      <div class="tabbar">
        <button class="tab active" data-tab="props">Properties</button>
        <button class="tab" data-tab="nets">Nets</button>
        <button class="tab" data-tab="problems">Problems</button>
      </div>
      <div class="tabpane" id="pane-props">
        <div id="selection" class="box">(none)</div>
      </div>
      <div class="tabpane hidden" id="pane-nets">
        <div id="nets" class="list"></div>
      </div>
      <div class="tabpane hidden" id="pane-problems">
        <div id="problems" class="list"></div>
      </div>
    </aside>
  </main>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <dialog id="partDlg">
    <div class="dlgbar">
      <strong id="partTitle">New pin bar</strong>
      <span class="grow"></span>
      <button id="partCancel">Cancel</button>
      <button id="partCreate" class="primary">Create</button>
    </div>
    <div class="form">
      <label>Label <input id="pLabel" type="text" value="Header" size="16"></label>
      <label>Type
        <select id="pDouble">
          <option value="no">single row</option>
          <option value="yes">double row</option>
        </select>
      </label>
      <label>Pins <input id="pCount" type="number" min="1" max="60" value="8"></label>
      <label id="rowGap">Gap between rows (holes) <input id="pGap" type="number" min="2" max="30" value="3"></label>
      <label id="rowPrefix">Pin prefix <input id="pPrefix" type="text" value="" size="8" placeholder="(none)"></label>
      <label id="rowLeft">Left prefix <input id="pLeft" type="text" value="L" size="8"></label>
      <label id="rowRight">Right prefix <input id="pRight" type="text" value="R" size="8"></label>
    </div>
  </dialog>
  <dialog id="saveDlg">
    <div class="dlgbar">
      <strong>Save board as</strong>
      <span class="grow"></span>
      <button id="saveCancel">Cancel</button>
      <button id="saveGo" class="primary">Save</button>
    </div>
    <div class="form">
      <label>File name <input id="saveName" type="text" size="30" placeholder="board"></label>
    </div>
  </dialog>
  <dialog id="sizeDlg">
    <div class="dlgbar">
      <strong>Board size — trade-offs</strong>
      <span class="grow"></span>
      <button id="sizeClose">Close</button>
    </div>
    <div class="form" id="sizeBody">computing…</div>
  </dialog>
  <dialog id="printDlg">
    <div class="dlgbar">
      <strong>Print / PDF (1:1)</strong>
      <span class="grow"></span>
      <button id="printCancel">Cancel</button>
      <button id="printGo" class="primary">Print</button>
    </div>
    <div class="form">
      <label>Origin (top-left hole) <input id="printOrigin" type="text" value="A1" size="6" placeholder="A1"></label>
      <div class="sectiontitle">Include</div>
      <label class="check"><input type="checkbox" id="pc-front" checked> Component side (1:1)</label>
      <label class="check"><input type="checkbox" id="pc-copper" checked> Copper side (mirrored, no parts)</label>
      <label class="check"><input type="checkbox" id="pc-holes" checked> Mounting holes</label>
      <label class="check"><input type="checkbox" id="pc-cuts" checked> Cuts</label>
      <label class="check"><input type="checkbox" id="pc-jumpers" checked> Jumpers</label>
      <label class="check"><input type="checkbox" id="pc-bom" checked> BOM</label>
      <label class="check"><input type="checkbox" id="pc-steps" checked> Assembly steps (+ net check)</label>
    </div>
  </dialog>
  <dialog id="netDlg">
    <div class="dlgbar">
      <strong>Netlist</strong>
      <select id="netFormat">
        <option value="json">JSON</option>
        <option value="spice">SPICE</option>
        <option value="kicad">KiCad (.net)</option>
      </select>
      <span class="grow"></span>
      <button id="netCopy">Copy</button>
      <button id="netDownload">Download</button>
      <button id="netClose">Close</button>
    </div>
    <pre id="netText"></pre>
  </dialog>
  <dialog id="asciiDlg">
    <div class="dlgbar">
      <strong>Board as text</strong>
      <span class="grow"></span>
      <button id="asciiCopy">Copy</button>
      <button id="asciiClose">Close</button>
    </div>
    <pre id="asciiText"></pre>
  </dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
