<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stripboard Shield Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <strong class="brand">Stripboard Planner</strong>
    <button id="new">New</button>
    <button id="open">Open</button>
    <button id="save">Save</button>
    <span class="sep"></span>
    <label>Cols <input id="cols" type="number" min="4" max="80" value="34"></label>
    <label>Rows <input id="rows" type="number" min="4" max="60" value="26"></label>
    <span class="sep"></span>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <span class="sep"></span>
    <button id="connect" class="toggle">Connect</button>
    <button id="rotate">Rotate</button>
    <button id="lock">Lock</button>
    <button id="delete">Delete</button>
    <span class="sep"></span>
    <button id="solve" class="primary">Solve</button>
    <button id="optimize">Optimize</button>
    <button id="compact">Compact</button>
    <button id="trim">Trim board</button>
    <button id="ascii">Text</button>
    <label class="check"><input type="checkbox" id="copper"> copper side</label>
    <label class="check"><input type="checkbox" id="names" checked> pin names</label>
    <span id="status" class="status"></span>
  </header>
  <main>
    <aside id="palette"><h3>Parts</h3><div id="palette-list" class="list"></div></aside>
    <div id="canvasWrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="panel">
      <h3>Selection</h3>
      <div id="selection" class="box">(none)</div>
      <h3>Nets</h3>
      <div id="nets" class="list"></div>
      <h3>Problems</h3>
      <div id="problems" class="list"></div>
    </aside>
  </main>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <dialog id="asciiDlg">
    <div class="dlgbar">
      <strong>Board as text</strong>
      <span class="grow"></span>
      <button id="asciiCopy">Copy</button>
      <button id="asciiClose">Close</button>
    </div>
    <pre id="asciiText"></pre>
  </dialog>
  <script type="module" src="src/main.js"></script>
</body>
</html>
